<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SNOWFALL — 황혼의 설산</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Outfit:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="client/style.css?v=7.0.0" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="vignette"></div>
    <canvas id="mangaSpeedLinesCanvas"></canvas>
    <div id="surpriseBadge" class="off">!</div>
    <div id="skipHint" class="off">SKIP - SPACEBAR</div>

    <!-- 🚨 산사태 및 눈덩이 접근 붉은 모서리 위험 경고 비넷 오버레이 -->
    <div id="dangerVignette"></div>

    <!-- ⚠️ 눈덩이 출현 시 화면 좌/우 모서리 붉은 느낌표 아이콘 -->
    <div id="cornerWarnLeft" class="corner-warn off">
      <span class="corner-excl">!</span>
    </div>
    <div id="cornerWarnRight" class="corner-warn off">
      <span class="corner-excl">!</span>
    </div>

    <div id="overlay">
      <div id="hud">
        <div class="hud-box">
          <div class="hud-label">점수</div>
          <div class="hud-value" id="hScore">0<span>pts</span></div>
          <div id="bonusToast" class="bonus-toast"></div>
        </div>
        <!-- 🥇 화면 상단 독립 불투명 검은 원 3개 메달 인디케이터 -->
        <div id="medalHudContainer">
          <div class="medal-slot" id="mSlot0"></div>
          <div class="medal-slot" id="mSlot1"></div>
          <div class="medal-slot" id="mSlot2"></div>
        </div>

        <!-- 🎬 스테이지 첫 진입 3초 노출 후 스르륵 사라지는 타이틀 배너 -->
        <div class="hud-stage-banner" id="hStage">STAGE 1 · 새벽의 여명</div>
        <!-- 빈 placeholder: hud-right 스피드는 아래로 이동됨 -->
        <div style="min-width: 160px"></div>
      </div>

      <!-- 🏁 레이스 진행 현황 바 (화면 상단) -->
      <div id="raceBar">
        <div id="raceTrack">
          <!-- 스테이지 깃발 1~9 (JS로 동적 생성됨) -->
          <div id="raceFlags"></div>
          <!-- 도착 체커보드 -->
          <div id="raceFinish">
            <div class="checker-col">
              <div class="checker-cell dark"></div>
              <div class="checker-cell light"></div>
              <div class="checker-cell dark"></div>
              <div class="checker-cell light"></div>
            </div>
            <div class="checker-col">
              <div class="checker-cell light"></div>
              <div class="checker-cell dark"></div>
              <div class="checker-cell light"></div>
              <div class="checker-cell dark"></div>
            </div>
            <div class="checker-col">
              <div class="checker-cell dark"></div>
              <div class="checker-cell light"></div>
              <div class="checker-cell dark"></div>
              <div class="checker-cell light"></div>
            </div>
          </div>
          <!-- 플레이어 캐릭터 아이콘 -->
          <div id="racePlayer">🎿</div>
        </div>
      </div>

      <div id="bars">
        <div class="bar-group">
          <div class="bar-label bar-label-shadow">JUMP CHARGE (SPACE)</div>
          <div class="bar-track">
            <div class="bar-fill" id="jmpFill" style="width: 0%"></div>
          </div>
          <div
            class="bar-label bar-label-shadow"
            style="margin-top: 6px; color: #ff9900"
          >
            DRIFT CHARGE (SHIFT)
          </div>
          <div class="bar-track">
            <div
              class="bar-fill"
              id="driftFill"
              style="
                width: 0%;
                background: linear-gradient(90deg, #ff7700, #ffcc00);
              "
            ></div>
          </div>
        </div>
        <!-- 오른쪽 하단 스피드 박스 -->
        <div class="hud-box hud-right" id="hSpeedBox">
          <div class="hud-label">속도</div>
          <div class="hud-value" id="hSpeed">0<span>km/h</span></div>
        </div>
      </div>
      <!-- 스피드 fill bar (숨김, 내부 로직용 유지) -->
      <div style="display: none"><div id="spdFill"></div></div>

      <div id="toast">
        <div id="toast-sub">STAGE 1</div>
        <div id="toast-main">새벽의 여명</div>
      </div>
    </div>

    <!-- Start Screen -->
    <div class="screen" id="scStart">
      <div class="screen-deco">
        <div class="screen-line"></div>
        <div class="screen-dot"></div>
        <div class="screen-line"></div>
      </div>
      <div class="logo-text">SNOWFALL</div>
      <div class="logo-sub" id="lblLogoSub">
        ESCAPE THE AVALANCHE! HIGH-SPEED ALPINE DESCENT
      </div>
      <div class="screen-deco">
        <div class="screen-line"></div>
        <div class="screen-dot"></div>
        <div class="screen-line"></div>
      </div>

      <!-- 캐릭터 프리뷰 + 버튼 2열 레이아웃 -->
      <div class="start-main-row">
        <!-- 왼쪽: 캐릭터 3D 프리뷰 -->
        <div class="char-preview-wrap" id="charPreviewWrap">
          <canvas id="charPreviewCanvas"></canvas>
          <div class="char-preview-name" id="charPreviewName">블레이즈</div>
          <button class="btn-edit" id="btnEditChar">✏ EDIT</button>
        </div>
        <!-- 오른쪽: 게임 시작 버튼 + 언어 선택 -->
        <div class="start-right-col">
          <button class="btn" id="btnStart">PLAY GAME</button>
          <div style="margin-top: 16px">
            <select
              id="langSelect"
              style="
                padding: 10px 16px;
                background: rgba(10, 20, 45, 0.85);
                color: #00f0ff;
                border: 1px solid rgba(0, 240, 255, 0.4);
                border-radius: 8px;
                font-weight: bold;
                cursor: pointer;
                font-size: 14px;
                backdrop-filter: blur(8px);
                outline: none;
              "
            >
              <option value="ko" selected>🇰🇷 한국어</option>
              <option value="en">🇺🇸 English</option>
              <option value="ja">🇯🇵 日本語</option>
              <option value="zh">🇨🇳 中文</option>
              <option value="fr">🇫🇷 Français</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Character Select Screen (메인 화면과 동일한 블러 배경) -->
    <div class="screen off" id="scCharSelect">
      <div class="charsel-header">
        <button class="btn-back" id="btnCharBack">← BACK</button>
        <div class="charsel-title">CHARACTER SELECT</div>
      </div>
      <div class="charsel-grid" id="charSelGrid">
        <!-- JS로 동적 생성 -->
      </div>
    </div>

    <div class="screen off" id="scPause">
      <div class="screen-deco">
        <div class="screen-line"></div>
        <div class="screen-dot"></div>
        <div class="screen-line"></div>
      </div>
      <div
        class="over-title"
        style="
          background: linear-gradient(135deg, #aaa, #fff);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        "
      >
        PAUSED
      </div>
      <div class="over-stats">PAUSED</div>
      <button class="btn" id="btnResume">RESUME</button>
    </div>

    <div class="screen off" id="scOver">
      <div class="screen-sub">SESSION TERMINATED</div>
      <div class="over-title">WIPEOUT!</div>
      <div class="over-stats" id="overStats"></div>
      <button class="btn" id="btnRestart">TRY AGAIN</button>
    </div>

    <!-- Main Module Script (Client Architecture v7.0.0 - Full i18n & Hover Rotation) -->
    <script type="module" src="client/src/main.js?v=7.0.0"></script>
  </body>
</html>
